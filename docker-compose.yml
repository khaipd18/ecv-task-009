# ============================================================================
# Mini Data Platform — Postgres + Airflow + Superset
# Chạy được trên: WSL2 Ubuntu (amd64) và macOS Apple Silicon (arm64)
# macOS M-series: xem docker-compose.override.yml.example
# ============================================================================

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
    dockerfile: Dockerfile
  image: dataplat/airflow:2.10.5
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${TZ}
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: ${TZ}
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Connection tới DB nghiệp vụ — tạo bằng ENV nên không phải click UI
    AIRFLOW_CONN_OLIST_POSTGRES: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${APP_DB}
    PYTHONPATH: /opt/airflow/scripts
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./sql:/opt/airflow/sql
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  # Hardening: chặn leo thang quyền qua binary setuid. Không app nào ở đây cần,
  # nên bật không rủi ro. Áp cho cả 3 service airflow qua anchor này.
  security_opt:
    - no-new-privileges:true
  networks: [dataplat]
  logging: &default-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # các biến dưới được init script đọc
      AIRFLOW_DB: ${AIRFLOW_DB}
      SUPERSET_DB: ${SUPERSET_DB}
      APP_DB: ${APP_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SUPERSET_RO_USER: ${SUPERSET_RO_USER}
      SUPERSET_RO_PASSWORD: ${SUPERSET_RO_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # Cho Postgres đủ thời gian checkpoint + đóng kết nối sạch khi stop.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    # Trần RAM: chống 1 container ăn hết bộ nhớ làm treo laptop (limit = trần,
    # không phải reservation, nên bình thường dùng ít hơn nhiều).
    deploy:
      resources:
        limits:
          memory: 1g
    networks: [dataplat]
    logging: *default-logging

  # --------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: dp-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    # KHONG dat entrypoint: /bin/bash o day. Entrypoint goc cua image la cho
    # ghi user uid hien tai vao /etc/passwd; bo qua no thi Airflow goi
    # getuser() se chet voi "getpwuid(): uid not found".
    command:
      - bash
      - -c
      - |
        set -e
        echo ">> airflow db migrate"
        airflow db migrate
        echo ">> tạo user admin (bỏ qua nếu đã có)"
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Data --lastname Team \
          --role Admin --email admin@example.com || true
        echo ">> init xong"
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: dp-airflow-web
    command: webserver
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500m

  airflow-scheduler:
    <<: *airflow-common
    container_name: dp-airflow-sched
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      # `airflow jobs check` mở kết nối DB metadata; trên WSL2 lúc scheduler đang
      # bận (parse DAG, adopt orphaned tasks) nó thường vượt 10s -> báo unhealthy
      # giả dù scheduler chạy tốt. Nới timeout + start_period cho khớp thực tế.
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500m

  # --------------------------------------------------------------------------
  superset-init:
    build:
      context: ./docker/superset
      dockerfile: Dockerfile
    image: dataplat/superset:4.1.1
    container_name: dp-superset-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      PYTHONPATH: /app/pythonpath
      DATABASE_DIALECT: postgresql
      SUPERSET_DB_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${SUPERSET_DB}
      TZ: ${TZ}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    user: "root"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        superset db upgrade
        superset fab create-admin \
          --username "${SUPERSET_ADMIN_USER}" \
          --password "${SUPERSET_ADMIN_PASSWORD}" \
          --firstname Data --lastname Team \
          --email admin@example.com || true
        superset init
    restart: "no"
    networks: [dataplat]
    logging: *default-logging

  superset:
    image: dataplat/superset:4.1.1
    container_name: dp-superset
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    environment: *superset-env
    ports:
      - "${SUPERSET_HOST_PORT:-8088}:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [dataplat]
    logging: *default-logging

volumes:
  pgdata:

networks:
  dataplat:
    driver: bridge
